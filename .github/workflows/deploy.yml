name: Deploy Job Shared to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting Deployment for Job-Shared Library..."
            cd /opt/job-platform/job-shared
            git pull origin main
            
            echo "🔄 Rebuilding Apps to update Autoloader with new Shared classes..."
            cd /opt/job-platform
            docker compose up -d --build job-app job-admin
            
            echo "🧹 Clearing All Caches..."
            docker exec job_app_web php artisan optimize:clear
            docker exec job_admin_web php artisan optimize:clear
            
            echo "🗑️ Auto-cleaning old Docker images to save VPS space..."
            docker image prune -f
            
            echo "✅ Deployment Successful!"